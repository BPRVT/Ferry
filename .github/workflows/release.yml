# Release workflow — builds the Fire TV APK from source on a version tag.
#
# WHY THIS EXISTS: the upstream project had no release workflow. Its CI produced only
# debug APKs with a 7-day retention, which means any published release binary was built
# on a maintainer's machine and hand-uploaded, with no verifiable link to the source it
# claimed to come from. This workflow closes that gap: every Ferry release is built by
# GitHub from the exact tagged commit, and the job summary records the commit SHA and the
# artifact's sha256 so anyone can check what they downloaded.
#
# SIGNING is optional and entirely secret-driven. If the four KEYSTORE_* / KEY_* secrets
# are configured, the APK is signed; if they are not, the workflow still succeeds and
# publishes an unsigned APK (which must be signed locally before it can be installed).
# No keystore is ever committed to this repository.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:          # allows a manual dry run without cutting a tag

permissions:
  contents: write             # required to create the GitHub Release

jobs:
  release:
    name: Build and publish Fire TV APK
    runs-on: ubuntu-latest

    # The `secrets` context is not available in a step-level `if`, so fold the
    # "is signing configured?" question into an env var here, where secrets *are*
    # available, and test that instead.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history so the release notes can reference it

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # The NDK and CMake versions are pinned in app/build.gradle.kts. Install exactly
      # those so the shipped libplayfair.so / libalac.so match a local build.
      - name: Install pinned NDK and CMake
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # Gate the release on the same checks CI runs, so a tag can never ship code that
      # would have failed a pull request.
      - name: Run JVM protocol tests
        run: ./gradlew :test-runner:test --stacktrace

      - name: Lint
        run: ./gradlew :app:lintFiretvDebug --stacktrace

      # Decode the keystore only if it is configured. Written outside the workspace so it
      # cannot be picked up by a later step or accidentally uploaded as an artifact.
      - name: Decode signing keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFiretvRelease --stacktrace

      - name: Stage artifact and record provenance
        id: artifact
        run: |
          APK=$(find app/build/outputs/apk/firetv/release -name '*.apk' | head -1)
          VERSION="${GITHUB_REF_NAME}"
          OUT="ferry-${VERSION}-firetv.apk"
          cp "$APK" "$OUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "path=$OUT"   >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          # Ask apksigner, don't look for META-INF/*.RSA. That file only exists
          # for v1 (JAR) signing, which AGP skips entirely when minSdk >= 24 —
          # Ferry's minSdk is 25 — so the old grep reported "no" on a correctly
          # v2-signed APK and made every signed release look unsigned.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          if "$APKSIGNER" verify "$OUT" 2>/dev/null; then
            echo "signed=yes" >> "$GITHUB_OUTPUT"
            SIGNER_SHA=$("$APKSIGNER" verify --print-certs "$OUT" 2>/dev/null \
                          | awk -F': ' '/SHA-256 digest/ {print $2; exit}')
            echo "signer_sha256=$SIGNER_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
            echo "signer_sha256=n/a" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Ferry ${VERSION}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Artifact | \`${OUT}\` |"
            echo "| sha256 | \`${SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferry-firetv-release
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          draft: true          # review before it goes public
          generate_release_notes: true
          body: |
            Built from source by GitHub Actions from commit `${{ github.sha }}`.

            | | |
            |---|---|
            | Artifact | `${{ steps.artifact.outputs.path }}` |
            | sha256 | `${{ steps.artifact.outputs.sha256 }}` |
            | Signed | `${{ steps.artifact.outputs.signed }}` |
            | Signing cert SHA-256 | `${{ steps.artifact.outputs.signer_sha256 }}` |

            Verify your download matches:

            ```
            shasum -a 256 ${{ steps.artifact.outputs.path }}
            ```

            Install on a Fire TV (ADB debugging and Apps from Unknown Sources enabled):

            ```
            adb connect <fire-tv-ip>:5555
            adb install -r ${{ steps.artifact.outputs.path }}
            ```

            Ferry is GPLv3. It is derived from mazer666/PhairPlay; see NOTICE for the
            full provenance chain, and AUDIT.md for the security audit.
